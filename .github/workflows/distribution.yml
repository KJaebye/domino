name: Distribution smoke tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.9'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: eccb8b0935e55c448af1e5e518bec37a479ef93c # Real 0.17.5 upgrade baseline
          path: .baseline
          persist-credentials: false
      - run: python -m pip install '.[dev]'
      - run: python -m unittest tests.test_channels tests.test_distribution tests.test_release -q
      - run: python scripts/build_release.py && python scripts/verify_artifacts.py
      - name: Build the previous release and test pip upgrade and removal
        run: |
          python .baseline/scripts/build_release.py
          python scripts/verify_pip.py --previous-release .baseline/dist/release
          python scripts/build_distribution.py --release .baseline/dist/release --output /tmp/domino-previous-distribution
      - name: Build a signed apt repository with a disposable CI key
        shell: bash
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key 'Domino CI <ci@example.invalid>' ed25519 sign 1d
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')"
          python scripts/prepare_channels.py --output /tmp/domino-channels --sign-key "$fingerprint" --previous-repo /tmp/domino-previous-distribution/apt
          ln -s /tmp/domino-channels/distribution /tmp/domino-distribution
          gpg --verify /tmp/domino-distribution/apt/dists/stable/InRelease
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/domino-channels/apt-site/domino.sources').read_text()
          source = source.replace('https://kjaebye.github.io/domino-apt/', 'file:/tmp/domino-distribution/apt/')
          Path('/tmp/domino-ci.sources').write_text(source)
          PY
          rm -rf "$GNUPGHOME"
      - name: Install, upgrade and remove through apt while preserving user files
        shell: bash
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist=/tmp/domino-ci.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends /tmp/domino-previous-distribution/*.deb
          test "$(/usr/bin/domino --version)" = 0.17.5
          temporary_home="$(mktemp -d)"
          HOME="$temporary_home" /usr/bin/domino --help
          test -z "$(ls -A "$temporary_home")"
          python scripts/package_home.py seed "$temporary_home" /tmp/domino-home.json
          sudo env HOME="$temporary_home" apt-get install -y --only-upgrade --no-install-recommends -o Dir::Etc::sourcelist=/tmp/domino-ci.sources -o Dir::Etc::sourceparts=- domino-proxy
          test "$(dpkg-query -W -f='${Version}' domino-proxy)" = "$(python -c 'import domino_cli; print(domino_cli.VERSION)')-1"
          dpkg-deb --info /tmp/domino-distribution/*.deb
          test -z "$(dpkg-query -L domino-proxy | grep -E '/(systemd|LaunchAgents)/' || true)"
          HOME="$temporary_home" /usr/bin/domino --version
          HOME="$temporary_home" /usr/bin/domino --help
          sudo env HOME="$temporary_home" /usr/bin/domino --version
          test -z "$(find /usr/lib/domino -name __pycache__ -print -quit)"
          python scripts/package_home.py check "$temporary_home" /tmp/domino-home.json
          sudo env HOME="$temporary_home" apt-get remove -y domino-proxy
          test ! -e /usr/bin/domino
          test ! -e /usr/bin/domino-install
          test ! -e /usr/lib/domino
          test ! -e /usr/share/doc/domino-proxy
          python scripts/package_home.py check "$temporary_home" /tmp/domino-home.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb-${{ matrix.os }}
          path: /tmp/domino-distribution
  homebrew:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: eccb8b0935e55c448af1e5e518bec37a479ef93c # Real 0.17.5 upgrade baseline
          path: .baseline
          persist-credentials: false
      - run: python -m pip install '.[dev]' && python scripts/build_release.py
      - run: python .baseline/scripts/build_release.py
      - name: Install, upgrade and remove from a local, unpublished tap
        shell: bash
        env:
          # Brew adds and removes its own tap trust records during this lifecycle.
          # Keep those records separate without changing Domino's XDG_CONFIG_HOME.
          HOMEBREW_XDG_CONFIG_HOME: /tmp/domino-brew-config
          HOMEBREW_CACHE: /tmp/domino-brew-cache
          HOMEBREW_LOGS: /tmp/domino-brew-logs
        run: |
          brew tap-new domino-ci/local
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          tap = Path(subprocess.check_output(['brew', '--repository', 'domino-ci/local'], text=True).strip())
          for source, destination in [('.baseline/dist/release', tap / 'Formula/domino.rb'),
                                      ('dist/release', Path('/tmp/domino-upgrade.rb'))]:
              release = Path(source).resolve()
              formula = (release / 'domino.rb.in').read_text()
              runtime = next(release.glob('domino-runtime-*.tar.gz'))
              formula = re.sub(r'^  url .*$', '  url "' + runtime.as_uri() + '"', formula, flags=re.M)
              destination.write_text(formula)
          PY
          brew install domino-ci/local/domino
          temporary_home="$(mktemp -d)"
          test "$(HOME="$temporary_home" "$(brew --prefix domino-ci/local/domino)/bin/domino" --version)" = 0.17.5
          test -z "$(ls -A "$temporary_home")"
          python scripts/package_home.py seed "$temporary_home" /tmp/domino-home.json
          cp /tmp/domino-upgrade.rb "$(brew --repository domino-ci/local)/Formula/domino.rb"
          HOME="$temporary_home" HOMEBREW_NO_AUTO_UPDATE=1 brew upgrade domino-ci/local/domino
          brew test domino-ci/local/domino
          test "$(HOME="$temporary_home" "$(brew --prefix domino-ci/local/domino)/bin/domino" --version)" = "$(python -c 'import domino_cli; print(domino_cli.VERSION)')"
          python scripts/package_home.py check "$temporary_home" /tmp/domino-home.json
          prefix="$(brew --prefix domino-ci/local/domino)"
          HOME="$temporary_home" brew uninstall --force domino-ci/local/domino
          test ! -e "$prefix"
          python scripts/package_home.py check "$temporary_home" /tmp/domino-home.json
