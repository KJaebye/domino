name: Verify
on:
  workflow_call:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: '3.9'}
          - {os: ubuntu-22.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04-arm, python: '3.12'}
          - {os: ubuntu-26.04, python: '3.14'}
          - {os: macos-15-intel, python: '3.9'}
          - {os: macos-15-intel, python: '3.13'}
          - {os: macos-15, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh dbus-x11 dconf-cli dconf-service gsettings-desktop-schemas
      - run: python -m pip install '.[dev]'
      - run: python scripts/check_repository.py
      - run: python scripts/fetch_test_core.py --output .test-resources/mihomo
      - run: python scripts/verify.py --require-core
        env:
          DOMINO_TEST_CORE: ${{ github.workspace }}/.test-resources/mihomo
      - run: python scripts/build_release.py
      - run: python scripts/verify_artifacts.py
      - run: python scripts/verify_pip.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/verification.json
            dist/repository-verification.json
            dist/artifact-verification.json
            dist/pip-verification.json
