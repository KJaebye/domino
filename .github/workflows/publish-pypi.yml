name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.9'
      - name: Require a chosen license and an exact version tag
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          test -s LICENSE
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          import domino_cli
          assert os.environ['EXPECTED_TAG'] == 'v' + domino_cli.VERSION, 'Tag and source version differ'
          PY
      - run: python -m pip install '.[dev]'
      - run: python -m unittest tests.test_distribution tests.test_release -q
      - run: python scripts/build_release.py && python scripts/verify_artifacts.py
      - run: python scripts/verify_pip.py
      - run: python -m build --sdist --outdir dist/pypi
      - run: cp dist/release/*.whl dist/pypi/ && python -m twine check dist/pypi/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-distributions
          path: dist/pypi/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/domino-proxy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pinned main
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using a configured PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
