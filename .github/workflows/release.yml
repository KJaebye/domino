name: Release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.9'
      - run: python -m pip install '.[dev]'
      - run: python scripts/check_repository.py
      - run: python scripts/build_release.py
      - run: python scripts/verify_artifacts.py
      - run: python scripts/verify_pip.py
      - run: python -m build --sdist --outdir dist/pypi
      - run: cp dist/release/*.whl dist/pypi/
      - run: python -m twine check dist/pypi/*
      - run: python scripts/build_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: domino-release
          if-no-files-found: error
          path: |
            dist/release/*.whl
            dist/release/domino-runtime-*.tar.gz
            dist/release/release.json
            dist/release/SHA256SUMS
            dist/release/domino.rb.in
            dist/artifact-verification.json
            dist/pypi/*
            dist/distribution-*/**
